[project]
name = "lib-tokenizers"
version = "0.1.0"
description = "LiB (Less is Better) tokenizer - HuggingFace compatible"
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
